# gen-chibi — edge Caddy for "Go online" path A (your domain's A record → this machine, HTTPS by Caddy). v0.21
# © 2026 Gen Labs — All rights reserved.
# Loaded ONLY when `genchibi online --caddy` turned it on (marker edge/caddy.enabled). genchibi composes
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml [-f docker-compose.override.yml]
# and never sets COMPOSE_FILE (that would silently drop your override — CNS-169).
# Own container: if ports 80/443 are taken, only this service fails; the app keeps running.
# Caddy runs as your user (not root) on 8080/8443 inside the container; Docker publishes 80→8080, 443→8443 (CNS-187).
# Config comes from files in ./edge/conf (Caddyfile + sites.caddy + edge-secret written by the app), mounted READ-ONLY — a restart re-reads them;
# the app reloads Caddy through the admin unix socket ./edge/run/caddy-admin.sock (no admin port, no docker.sock — spec §3.1).
# Caddy gets only what it needs: never the whole install dir, never ./run (cloudflared's tunnel token lives in ./run/tunnel.token).
# Service name is prefixed so it never merges with a `caddy` service in your override (CNS-194).
services:
  gen-chibi-edge:
    # pinned tag (Docker Hub library/caddy, checked 2026-10-20); Apache-2.0 — see ASSET_MANIFEST.md
    image: caddy:2.11.7
    container_name: gen-chibi-edge
    user: "${GC_UID:-1000}:${GC_GID:-1000}"
    command: ["caddy", "run", "--config", "/edge/conf/Caddyfile", "--adapter", "caddyfile"]
    environment:
      XDG_DATA_HOME: /edge/caddy-data      # certificates + ACME account (kept across restarts)
      XDG_CONFIG_HOME: /edge/caddy-config  # Caddy's autosave of the last loaded config
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      # GC_EDGE_DIR (set by genchibi since v0.23.1): ~/.local/lib/gen-chibi/edge, OUTSIDE the install folder — the app can write inside these folders but can
      # never swap a mount source for a link to another host path (the docker daemon would follow it). Unset (older genchibi) = ./edge as before.
      - ${GC_EDGE_DIR:-./edge}/conf:/edge/conf:ro          # Caddyfile, sites.caddy, edge-secret ({file.…} placeholder) — app writes, Caddy only reads
      - ${GC_EDGE_DIR:-./edge}/run:/edge/run               # admin unix socket (0660)
      - ${GC_EDGE_DIR:-./edge}/caddy-data:/edge/caddy-data
      - ${GC_EDGE_DIR:-./edge}/caddy-config:/edge/caddy-config
    depends_on: [app]
    restart: unless-stopped
  # the app sees the same two folders at its usual paths (/install/edge/conf, /install/edge/run): its code does not change
  app:
    volumes:
      - ${GC_EDGE_DIR:-./edge}/conf:/install/edge/conf
      - ${GC_EDGE_DIR:-./edge}/run:/install/edge/run
