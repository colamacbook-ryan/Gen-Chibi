# gen-chibi — run with Docker (install.sh copies this file into the install folder, next to .env)
# © 2026 Gen Labs — All rights reserved.
# No custom image: the official Node image runs the code in ./releases/<version>, pointed to by ./current.
# Update = the app downloads the new version into ./releases and switches ./current; the launcher restarts it and rolls back automatically on failure.
name: gen-chibi
services:
  app:
    image: node:22-alpine
    container_name: gen-chibi
    working_dir: /install
    command: ["node", "/install/launcher.js"]
    user: "${GC_UID:-1000}:${GC_GID:-1000}"
    environment:
      GC_HOME: /install
      GC_PORT: "7480"
      GC_LISTEN: 0.0.0.0
      GC_IN_DOCKER: "1"
      GC_MASTER_KEY: ${GC_MASTER_KEY:?GC_MASTER_KEY missing in .env (run install.sh)}
      GC_AUTO_UPDATE: ${GC_AUTO_UPDATE:-1}
      GC_API_TOKEN: ${GC_API_TOKEN:-}
      GC_ALLOWED_HOSTS: ${GC_ALLOWED_HOSTS:-}
      GC_MCP_KEY: ${GC_MCP_KEY:-}
      GC_PUBLIC_URL: ${GC_PUBLIC_URL:-}
      GC_OAUTH_REDIRECTS: ${GC_OAUTH_REDIRECTS:-}
      GC_OAUTH_ACCESS_TTL: ${GC_OAUTH_ACCESS_TTL:-}
      GC_CLIENT_IP_HEADER: ${GC_CLIENT_IP_HEADER:-}
      GC_REPO: ${GC_REPO:-colamacbook-ryan/Gen-Chibi}
      GC_GITHUB_TOKEN: ${GC_GITHUB_TOKEN:-}
      # interface language: en | vi — initial value / deliberate override (install.sh --lang, genchibi lang); empty = keep the Studio default
      GC_LANG: ${GC_LANG:-}
      # company network behind a proxy: set these in .env
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_EXTRA_CA_CERTS: ${GC_EXTRA_CA:-}
    ports:
      - "${GC_BIND:-127.0.0.1}:${GC_PORT:-7480}:7480"
    volumes:
      - ./:/install
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7480/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MCP to the Internet through Cloudflare Tunnel — turned on by `genchibi expose` (sets COMPOSE_PROFILES in .env).
  # Named tunnel: forwards only the /mcp + OAuth routes (see tunnel/config.yml generated by genchibi).
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    container_name: gen-chibi-tunnel
    user: "${GC_UID:-1000}:${GC_GID:-1000}"
    environment:
      HOME: /work
    command: ["tunnel", "--config", "/work/config.yml", "run"]
    volumes:
      - ./tunnel:/work
    depends_on: [app]
    restart: unless-stopped
  # Temporary tunnel *.trycloudflare.com (no account needed, the link changes on every restart)
  tunnel-quick:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["quick"]
    container_name: gen-chibi-tunnel-quick
    user: "${GC_UID:-1000}:${GC_GID:-1000}"
    environment:
      HOME: /work
    command: ["tunnel", "--url", "http://app:7480"]
    volumes:
      - ./tunnel:/work
    depends_on: [app]
    restart: unless-stopped
