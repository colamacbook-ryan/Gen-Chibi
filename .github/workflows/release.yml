# Phát hành tự động: đổi VERSION trên main (hoặc đẩy tag vX.Y.Z) → kiểm thử → đóng gói → GitHub Release
# (gói + SHA256SUMS + ghi chú từ CHANGELOG.md). Bản cài trên máy người dùng đọc Release này để tự cập nhật.
name: release
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # CNS-236: bản phát hành không bao giờ ra nếu xuất video MP4 (Chrome thật, Windows / macOS) hỏng — cùng workflow với ci.yml
  video-mp4:
    uses: ./.github/workflows/video-mp4.yml
  # v0.23 B6: bản phát hành không ra nếu bộ test trình duyệt (Ubuntu + Chromium ghim bản, mọi nhóm) đỏ — cùng workflow với ci.yml
  browser:
    uses: ./.github/workflows/browser.yml
  release:
    needs: [video-mp4, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Xác định phiên bản
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d ' \n' < VERSION)"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "VERSION không hợp lệ: $TAG"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then echo "Tag $GITHUB_REF_NAME khác VERSION $TAG"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Đã có Release $TAG — bỏ qua."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Kiểm thử
        if: steps.ver.outputs.skip != '1'
        run: bash tools/test.sh
      - name: Đóng gói
        if: steps.ver.outputs.skip != '1'
        run: bash tools/package.sh dist
      - name: Ghi chú phát hành từ CHANGELOG.md
        if: steps.ver.outputs.skip != '1'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          bash tools/release-notes.sh "$TAG" > notes.md
          test -s notes.md || echo "Release $TAG" > notes.md
      - name: Tạo Release (kèm tag)
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --target "$GITHUB_SHA" --title "gen-chibi $TAG" --notes-file notes.md
