# Job MP4 Windows / macOS dùng CHUNG cho ci.yml (mỗi lần đẩy main / PR) và release.yml (CNS-236: KHÔNG phát hành nếu nhánh MP4 hỏng) — một nơi định nghĩa.
# Chrome có sẵn của runner xuất 1 phân cảnh Fun Office bằng WebCodecs thật (tools/video-ci.mjs): 720p, tab nền, 1080p, 9:16 1080p (CNS-239).
name: video-mp4
on:
  workflow_call:
permissions:
  contents: read
jobs:
  video-mp4:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ffmpeg để ĐO lệch tiếng / hình thật (giải mã tệp → tìm mẫu dấu tiếng). Có sẵn thì dùng; macOS: bottle Homebrew (không auto-update), Windows: Chocolatey.
      - name: Cài ffmpeg (đo đồng bộ tiếng thật)
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else choco install ffmpeg -y --no-progress; fi
          fi
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
      - name: Xuất 1 phân cảnh MP4 bằng Chrome thật
        run: node tools/video-ci.mjs --require-mp4 --require-ffmpeg --out video-out
      - name: Xuất ở tab nền (bị ẩn, timer bị bóp)
        run: node tools/video-ci.mjs --require-mp4 --require-ffmpeg --hidden --out video-out-hidden
      # CNS-239: Chrome THẬT ở 1080p (mặc định của Studio) và 9:16 1080p (1080×1920) — mỗi lượt 1 phân cảnh (~20 s phim, ~1 phút xuất)
      - name: Xuất 1080p
        run: node tools/video-ci.mjs --require-mp4 --require-ffmpeg --quality 1080p --out video-out-1080p
      - name: Xuất 9:16 1080p
        run: node tools/video-ci.mjs --require-mp4 --require-ffmpeg --quality 1080p --frame 9x16 --out video-out-9x16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ matrix.os }}
          path: |
            video-out
            video-out-hidden
            video-out-1080p
            video-out-9x16
          if-no-files-found: ignore
